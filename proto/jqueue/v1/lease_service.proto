syntax = "proto3";

package jqueue.v1;
option go_package = "github.com/pravinkanna/jQueue/gen/go/jqueue/v1;jqueuev1";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "jqueue/v1/job.proto";


service LeaseService {
  rpc LeaseJob(LeaseJobRequest) returns (LeaseJobResponse);
  rpc ExtendJobLease(ExtendJobLeaseRequest) returns (ExtendJobLeaseResponse);
  rpc AckJob(AckJobRequest) returns (AckJobResponse);
  rpc NackJob(NackJobRequest) returns (NackJobResponse);
}


message LeaseJobRequest {
  string queue = 1;
  google.protobuf.Duration lease_duration = 2;
  google.protobuf.Duration wait_timeout = 3;  // long-poll: max time server holds the call
}

message LeasedJob {
  string lease_token = 1;
  Job job = 2;
  google.protobuf.Timestamp lease_expires_at = 3;
}

message LeaseJobResponse {
  LeasedJob leased_job = 1;
}

message AckJobRequest {
  string lease_token = 1;
}

message AckJobResponse {}

message NackJobRequest {
  string lease_token = 1;
  string reason = 2;
}

message NackJobResponse {}

message ExtendJobLeaseRequest {
  string lease_token = 1;
  google.protobuf.Duration duration = 2;
}

message ExtendJobLeaseResponse {
  google.protobuf.Timestamp lease_expires_at = 1;
}
